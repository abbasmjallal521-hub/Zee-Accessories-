services:
  - type: web
    name: zee-accessories
    runtime: node
    plan: free
    buildCommand: echo "no build needed"
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: abbasmjallal521-hub/Zee-Accessories-
      - key: DATA_BRANCH
        value: data
  - type: web
    name: zeeaccessories
    runtime: static
    buildCommand: echo "static shop"
    staticPublishPath: ./public
    routes:
      - type: redirect
        source: /admin
        destination: https://zee-accessories.onrender.com/admin
      - type: redirect
        source: /admin.html
        destination: https://zee-accessories.onrender.com/admin
